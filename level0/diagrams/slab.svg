<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title">
<title id="title">Slab overlap and the choice between entry and exit surfaces</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#252a2d;font-size:20px} .small{font-size:17px} .title{font-size:25px;font-weight:600} .line{fill:none;stroke:#66747b;stroke-width:2} .vector{fill:none;stroke-width:4;marker-end:url(#arrow)} .axis{stroke:#9aa4a8;stroke-width:2} .hint{fill:#536169}</style>
<rect width="1000" height="440" rx="12" fill="#faf9f4"/>
<text x="35" y="40" class="title" >The box interval is the overlap of all three slabs</text><rect x="350" y="65" width="140" height="160" fill="#e2ede6"/><text x="35" y="101" class="" >x slab</text><line x1="140" y1="95" x2="770" y2="95" class="line" style="stroke:#b7bfc2"/><line x1="210" y1="95" x2="560" y2="95" class="line" style="stroke:#367668"/><circle cx="210" cy="95" r="5" fill="#367668"/><text x="210" y="83" class="small" text-anchor="middle">1</text><circle cx="560" cy="95" r="5" fill="#367668"/><text x="560" y="83" class="small" text-anchor="middle">6</text><text x="35" y="156" class="" >y slab</text><line x1="140" y1="150" x2="770" y2="150" class="line" style="stroke:#b7bfc2"/><line x1="280" y1="150" x2="490" y2="150" class="line" style="stroke:#367668"/><circle cx="280" cy="150" r="5" fill="#367668"/><text x="280" y="138" class="small" text-anchor="middle">2</text><circle cx="490" cy="150" r="5" fill="#367668"/><text x="490" y="138" class="small" text-anchor="middle">5</text><text x="35" y="211" class="" >z slab</text><line x1="140" y1="205" x2="770" y2="205" class="line" style="stroke:#b7bfc2"/><line x1="350" y1="205" x2="700" y2="205" class="line" style="stroke:#367668"/><circle cx="350" cy="205" r="5" fill="#367668"/><text x="350" y="193" class="small" text-anchor="middle">3</text><circle cx="700" cy="205" r="5" fill="#367668"/><text x="700" y="193" class="small" text-anchor="middle">8</text><text x="810" y="145" class="" >Shared interval</text><text x="810" y="174" class="" >[3, 5]</text><text x="35" y="270" class="" >Outside: entry is ahead</text><rect x="200" y="292" width="200" height="72" fill="#edf0f1" stroke="#66747b" stroke-width="2"/><line x1="65" y1="328" x2="455" y2="328" class="vector" style="stroke:#a65b31"/><circle cx="95" cy="328" r="7" fill="#a65b31"/><text x="74" y="395" class="" >O</text><text x="200" y="395" class="small" text-anchor="middle">entry</text><text x="400" y="395" class="small" text-anchor="middle">exit</text><text x="530" y="270" class="" >Inside: entry is behind, exit is ahead</text><rect x="610" y="292" width="220" height="72" fill="#edf0f1" stroke="#66747b" stroke-width="2"/><line x1="570" y1="328" x2="900" y2="328" class="vector" style="stroke:#a65b31"/><circle cx="705" cy="328" r="7" fill="#a65b31"/><text x="610" y="395" class="small" text-anchor="middle">tNear &lt; 0</text><text x="705" y="395" class="small" text-anchor="middle">O</text><text x="850" y="395" class="small" text-anchor="middle">tFar &gt; 0</text>
</svg>
