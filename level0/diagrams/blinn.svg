<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title">
<title id="title">The halfway vector between light and view aligns with the surface normal</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#252a2d;font-size:20px} .small{font-size:17px} .title{font-size:25px;font-weight:600} .line{fill:none;stroke:#66747b;stroke-width:2} .vector{fill:none;stroke-width:4;marker-end:url(#arrow)} .axis{stroke:#9aa4a8;stroke-width:2} .hint{fill:#536169}</style>
<rect width="1000" height="440" rx="12" fill="#faf9f4"/>
<text x="35" y="40" class="title" >Blinn–Phong compares the normal with the halfway direction</text><rect x="90" y="330" width="820" height="42" fill="#e8e3d5"/><line x1="90" y1="330" x2="910" y2="330" class="line" style="stroke:#66747b"/><line x1="500" y1="330" x2="290" y2="120" class="vector" style="stroke:#a65b31"/><text x="150" y="105" class="" >L: toward lamp</text><line x1="500" y1="330" x2="710" y2="120" class="vector" style="stroke:#956081"/><text x="715" y="105" class="" >V: toward camera</text><line x1="500" y1="330" x2="500" y2="90" stroke="#367668" stroke-width="8" marker-end="url(#arrow)"/><line x1="500" y1="330" x2="500" y2="90" class="vector" style="stroke:#566f9d"/><text x="525" y="100" class="" >H = normalize(L + V)</text><text x="425" y="90" class="" >N</text><circle cx="500" cy="330" r="7" fill="#252a2d"/><text x="500" y="405" class="small" text-anchor="middle">Here N and H align, so the specular factor reaches 1.</text>
</svg>
