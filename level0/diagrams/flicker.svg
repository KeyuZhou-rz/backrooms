<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title">
<title id="title">A 20 millisecond dip between draws at 30 and 60 milliseconds is missed</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#252a2d;font-size:20px} .small{font-size:17px} .title{font-size:25px;font-weight:600} .line{fill:none;stroke:#66747b;stroke-width:2} .vector{fill:none;stroke-width:4;marker-end:url(#arrow)} .axis{stroke:#9aa4a8;stroke-width:2} .hint{fill:#536169}</style>
<rect width="1000" height="440" rx="12" fill="#faf9f4"/>
<text x="35" y="40" class="title" >A 20 ms dimming window can fall between rendered frames</text><text x="35" y="75" class="small" >Illustrative zoom into an eligible lamp’s four-second cycle</text><rect x="415.0" y="110" width="180.0" height="210" fill="#f1e1d7"/><line x1="100.0" y1="110" x2="100.0" y2="330" stroke="#566f9d" stroke-width="2" stroke-dasharray="5 5"/><text x="100.0" y="359" class="small" text-anchor="middle">0 ms</text><line x1="370.0" y1="110" x2="370.0" y2="330" stroke="#566f9d" stroke-width="2" stroke-dasharray="5 5"/><text x="370.0" y="359" class="small" text-anchor="middle">30 ms</text><line x1="640.0" y1="110" x2="640.0" y2="330" stroke="#566f9d" stroke-width="2" stroke-dasharray="5 5"/><text x="640.0" y="359" class="small" text-anchor="middle">60 ms</text><line x1="910.0" y1="110" x2="910.0" y2="330" stroke="#566f9d" stroke-width="2" stroke-dasharray="5 5"/><text x="910.0" y="359" class="small" text-anchor="middle">90 ms</text><polyline points="100.0,135 415.0,135 415.0,300 595.0,300 595.0,135 910.0,135" fill="none" stroke="#a65b31" stroke-width="4"/><text x="75" y="141" class="small" text-anchor="end">1.0</text><text x="75" y="306" class="small" text-anchor="end">0.03</text><text x="505.0" y="272" class="small" text-anchor="middle">20 ms</text><text x="100" y="405" class="small" >Dashed lines: draws every 30 ms. Both surrounding frames see brightness 1.0.</text>
</svg>
