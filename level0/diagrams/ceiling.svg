<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title">
<title id="title">Aligned ceiling panel and point light, with separate emission, illumination, and glow</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#252a2d;font-size:20px} .small{font-size:17px} .title{font-size:25px;font-weight:600} .line{fill:none;stroke:#66747b;stroke-width:2} .vector{fill:none;stroke-width:4;marker-end:url(#arrow)} .axis{stroke:#9aa4a8;stroke-width:2} .hint{fill:#536169}</style>
<rect width="1000" height="440" rx="12" fill="#faf9f4"/>
<text x="35" y="40" class="title" >One panel, three calculations</text><text x="75" y="85" class="" >Top view: one 4 × 4 ceiling cell</text><rect x="80" y="110" width="240" height="240" fill="#e5e1d4" stroke="#66747b" stroke-width="2"/><rect x="143.6" y="173.6" width="112.8" height="112.8" fill="#fffdf2" stroke="#a65b31" stroke-width="2"/><text x="65" y="375" class="small" >0</text><text x="195" y="375" class="small" >2</text><text x="315" y="375" class="small" >4</text><text x="45" y="350" class="small" >0</text><text x="45" y="238" class="small" >2</text><text x="45" y="116" class="small" >4</text><circle cx="200" cy="230" r="6" fill="#367668"/><text x="200" y="403" class="small" text-anchor="middle">Panel and light share center (2, 2)</text><text x="440" y="95" class="" >Side view: ceiling at y = 3</text><line x1="440" y1="120" x2="930" y2="120" class="line" style="stroke:#66747b"/><rect x="620" y="111" width="130" height="18" fill="#fffdf2" stroke="#a65b31" stroke-width="2"/><circle cx="685" cy="145" r="6" fill="#367668"/><text x="720" y="165" class="small" >Point light at y = 2.9</text><line x1="685" y1="155" x2="550" y2="245" class="vector" style="stroke:#367668"/><line x1="685" y1="155" x2="820" y2="245" class="vector" style="stroke:#367668"/><text x="440" y="295" class="" >1. Emission: the panel looks bright</text><text x="440" y="335" class="" >2. Point light: other surfaces receive light</text><text x="440" y="375" class="" >3. Glow: nearby ceiling tiles look brighter</text>
</svg>
