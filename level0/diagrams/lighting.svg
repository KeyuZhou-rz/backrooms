<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title">
<title id="title">Normal, direction to lamp, viewing direction, and reflected direction</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#252a2d;font-size:20px} .small{font-size:17px} .title{font-size:25px;font-weight:600} .line{fill:none;stroke:#66747b;stroke-width:2} .vector{fill:none;stroke-width:4;marker-end:url(#arrow)} .axis{stroke:#9aa4a8;stroke-width:2} .hint{fill:#536169}</style>
<rect width="1000" height="440" rx="12" fill="#faf9f4"/>
<text x="35" y="40" class="title" >All directions are measured at the same surface point</text><rect x="70" y="330" width="860" height="42" fill="#e8e3d5"/><line x1="70" y1="330" x2="930" y2="330" class="line" style="stroke:#66747b"/><line x1="500" y1="330" x2="500" y2="95" class="vector" style="stroke:#367668"/><text x="520" y="95" class="" >N: surface normal</text><line x1="500" y1="330" x2="305" y2="135" class="vector" style="stroke:#a65b31"/><text x="130" y="115" class="" >L: toward lamp</text><line x1="500" y1="330" x2="695" y2="135" class="vector" style="stroke:#566f9d"/><text x="710" y="125" class="" >R: reflected light</text><line x1="500" y1="330" x2="805" y2="210" class="vector" style="stroke:#956081"/><text x="760" y="255" class="" >V: toward camera</text><circle cx="500" cy="330" r="7" fill="#252a2d"/><text x="500" y="403" class="small" text-anchor="middle">hit point</text><text x="80" y="295" class="small" >Incoming light travels along −L</text><line x1="225" y1="175" x2="350" y2="300" class="vector" style="stroke:#a65b31"/>
</svg>
