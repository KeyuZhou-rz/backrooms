<body bgcolor=black>
<center><canvas id=canvas width=800 height=800></canvas>
<script src=webgl.js></script>
<script>

function Scene() {

   this.vertexShader = `#version 300 es
   in  vec3 aPos;
   out vec3 vPos;
   void main() {
      gl_Position = vec4(aPos, 1.);
      vPos = aPos;
   }`;

   this.fragmentShader = `#version 300 es
   precision highp float;
   in  vec3 vPos;
   out vec4 fragColor;

   void main() {
      fragColor = vec4(0.0);

      // Camera position and the point it looks at.
      vec3 camera = vec3(2.4, 2.0, 4.0);
      vec3 target = vec3(0.0);

      // Build a camera coordinate system.
      vec3 forward = normalize(target - camera);
      vec3 right = normalize(cross(forward, vec3(0.0, 1.0, 0.0)));
      vec3 up = cross(right, forward);

      // Create one viewing ray for this fragment.
      vec3 rayOrigin = camera;
      vec3 rayDir = normalize(
         forward + 0.8 * vPos.y * right + 0.8 * vPos.x * up
      );

      // The box is centered at the origin.
      vec3 boxSize = vec3(0.65);

      // Find where the ray enters and leaves the box along each axis.
      vec3 t0 = (-boxSize - rayOrigin) / rayDir;
      vec3 t1 = ( boxSize - rayOrigin) / rayDir;

      vec3 tNear3 = min(t0, t1);
      vec3 tFar3 = max(t0, t1);

      // Combine the three axis intervals into one box interval.
      float tNear = max(max(tNear3.x, tNear3.y), tNear3.z);
      float tFar = min(min(tFar3.x, tFar3.y), tFar3.z);

      // Draw the cube only when the ray intersects the box.
      if (tNear <= tFar && tFar > 0.0) {
         float tHit = max(tNear, 0.0);

         // Position where the ray hits the cube.
         vec3 hit = rayOrigin + tHit * rayDir;

         // Find which face was hit.
         vec3 a = abs(hit);
         vec3 normal;

         if (a.x > a.y && a.x > a.z) {
            normal = vec3(sign(hit.x), 0.0, 0.0);
         }
         else if (a.y > a.z) {
            normal = vec3(0.0, sign(hit.y), 0.0);
         }
         else {
            normal = vec3(0.0, 0.0, sign(hit.z));
         }

         // Give different base colors to the visible faces.
         vec3 baseColor;

         if (normal.z > 0.5) {
            baseColor = vec3(0.25, 0.45, 1.0);
         }
         else if (normal.y > 0.5) {
            baseColor = vec3(0.35, 0.8, 0.45);
         }
         else {
            baseColor = vec3(1.0, 0.35, 0.2);
         }

         // Direction from the surface toward the light.
         vec3 lightDir = normalize(vec3(-1.0, 1.0, 2.0));

         // Lambert diffuse lighting.
         float diffuse = max(0.0, dot(normal, lightDir));

         // Add ambient light so the dark faces remain visible.
         float brightness = 0.2 + 0.8 * diffuse;

         fragColor = vec4(baseColor * brightness, 1.0);
      }
   }`;

}

gl_start(canvas, new Scene());
</script>
